name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows launcher
        shell: pwsh
        run: .\build_launcher.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ".\Achieve3000Installer.iss"'
      - uses: actions/upload-artifact@v4
        with:
          name: Achieve3000-Windows
          path: installer-output/Achieve3000Setup-v1.0.11.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build macOS launcher
        run: bash build_macos.sh
      - name: Package macOS app
        run: bash package_macos_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Achieve3000-macOS
          path: Achieve3000-macOS.dmg

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
